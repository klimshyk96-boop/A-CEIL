name: A·CEIL critical gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aceil-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: Security, project sync, PWA, and geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fast critical checks without Chromium
        env:
          CI: 'true'
        run: bash scripts/check-critical-ci.sh
