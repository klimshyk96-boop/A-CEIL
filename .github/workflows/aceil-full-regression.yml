name: A·CEIL full regression (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: All browser, geometry, and integration regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run complete regression suite
        env:
          CI: 'true'
        shell: bash
        run: |
          set +e
          bash scripts/run-all-tests.sh > /tmp/aceil-full-regression.log 2>&1 &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            sleep 25
            kill -0 "$test_pid" 2>/dev/null || break
            printf '%s %s\n' "Suite running:" "$(grep '^## ' /tmp/aceil-full-regression.log | tail -n 1)"
          done
          wait "$test_pid"
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "::error::A·CEIL full regression failed; last test output:"
            tail -n 100 /tmp/aceil-full-regression.log
            exit "$result"
          fi
          tail -n 28 /tmp/aceil-full-regression.log
